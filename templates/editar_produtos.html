{% extends 'base.html'%}
{% block conteudo%}
<div class="d-flex justify-content-start">
    <a href="{{url_for('produtos')}}" class="bi bi-arrow-bar-left texto-a">Voltar</a>
</div>
<h3 class="mb-4 text-start titulo-h3 mt-4">Editar dados
</h3>


<form method="POST" action="{{url_for('atualizar_produto', produto_id = produto['produto_id'])}}" class="form-sensor"
    enctype="multipart/form-data">
    <div class="cadastro-sensor ">
        <div class="d-flex justify-content-start mb-3 ms-3">
            <div class="upload-imagem me-5 mt-3 ">

                <label for="imagem_produto"
                    class="ms-0 uploaded-image border-radius-menor align-items-center justify-content-center d-flex position-relative">

                    {% if produto.imagem_base64 %}
                    <img role="img" aria-label="Imagem do produto" src="data:{{produto.imagem_tipo}};base64,{{produto.imagem_base64}}"
                        class="upload-imagem position-absolute t-0 l-0">
                    {%else%}
                    <img role="img" aria-label="imagem do produto" src="/static/imagens/medicamento.jpg" class="text-white aling-itens-center z-index-1">
                    {%endif%}
                </label>
                <input type="file" id="imagem_produto" name="imagem" accept="image/*" class="d-none">
                <p class="mt-3 texto-p">Clique na imagem para alterá-la</p>
            </div>

            <div class="divisao-form w-100 mt-5">
                <div class="mb-3 text-start">
                    <div class="input-group">
                        <input type="name" name="nome" class="form-control  border-radius-menor"
                            value="{{produto.produto_nome}}" required>
                    </div>
                </div>
                <div class="mb-3 text-start">
                    <div>
                        <textarea name="descricao" placeholder="Descrição" class="form-control "
                            style="height: 230px; resize: vertical; ">{{produto.produto_descricao}}</textarea>
                    </div>
                </div>
                <div class="d-flex">
                    <div class="mb-2 me-4 text-start w-100">
                        <div class="input-group">
                            <select class="form-select" name="categoria" required>
                                <option value="{{produto.produto_categoria}}">{{produto.produto_categoria}}</option>
                                <option value="Vacina">Vacina</option>
                                <option value="Antiparasitários">Antiparasitários</option>
                                <option value="Antibioticos">Antibioticos</option>
                                <option value="Anti-inflamatórios">Anti-inflamatórios</option>
                                <option value="Analgésicos">Analgésicos</option>
                                <option value="Anestésicos">Anestésicos</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-2 w-100">
                        <button aria-label="Alterar produto"
                            class="btn w-100 texto-a background-verde-medio border-radius-menor"
                            type="submit">Alterar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</form>

<script>
    localStorage.setItem('usuario_nome', "{{ session.get('usuario_nome')}}")
    localStorage.setItem('usuario_id', "{{ session.get('usuario_id')}}")
    localStorage.setItem('usuario_cargo', "{{ session.get('usuario_cargo')}}")

</script>
{% endblock%}
