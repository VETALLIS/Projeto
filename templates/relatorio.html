{% extends 'base.html'%}
{% block conteudo%}

<h3 class="mb-4 text-start" style="color: white; padding:10px; border-bottom:solid 1px #fff;">Indicador</h3>
<div class="d-flex  justify-content-between">


    <div class="col-4 d-flex">
        <div class="me-4 card-dash" style=" border-radius: 15px;background: rgba(255, 255, 255, 0.15); 
    padding: 5px; height: 160px;">
            <h5 class="text-start text-white fw-bold mb-0 ps-4 fs-5">Produtos <br>Vencidos</h5>
            <div class="border border-white rounded-circle d-flex align-items-center justify-content-center border-5 ms-3 mt-3 "
                style="width: 80px; height: 80px;">
                <i class="bi bi-box-seam text-white" style="font-size: 3rem;"></i>
            </div>
        </div>

        <div class="me-4 card-dash"
            style="border-radius: 15px; background: rgba(255, 255, 255, 0.15); padding: 5px; height: 160px;">
            <h5 class="text-start text-white fw-bold mb-0 ps-4 fs-5;">Sensor</h5>
            <div class="d-flex align-items-center gap-3 mt-2 ms-3">
                <div class="border border-white rounded-circle d-flex align-items-center justify-content-center border-5"
                    style="width: 80px; height: 80px; flex-shrink: 0;">
                    <i class="bi bi-thermometer-sun text-white" style="font-size: 3rem;"></i>
                </div>

                <div class="d-flex flex-column">
                    <!-- Mostra a quantidade total de sensores cadastrados -->
                    <label class="form-label mb-0" style="color: #fff; font-size: 0.9rem;">Quantidade Sensores:</label>

                    <label class="form-label mb-0 mt-1" style="color: #fff; font-size: 0.85rem;"></label>
                    <span style="color: #fff; font-size: 1.8rem; font-weight: bold; line-height: 1;">
                        {{ sensor }}
                    </span>
                </div>
            </div>
        </div>



        <!-- Card do Total Estoque (Sempre visível, fora do if) -->
        <div class="me-4 card-dash"
            style="border-radius: 15px; background: rgba(255, 255, 255, 0.15); padding: 5px; height: 160px;">
            <h5 class="text-start text-white fw-bold mb-0 ps-4 fs-5;">Total em Estoque</h5>
            <div class="d-flex align-items-center gap-3 mt-2 ms-3">
                <div class="border border-white rounded-circle d-flex align-items-center justify-content-center border-5"
                    style="width: 80px; height: 80px; flex-shrink: 0;">
                    <i class="bi bi-cart text-white" style="font-size: 3rem;"></i>
                </div>

                <div class="d-flex flex-column">
                    <!-- Mostra a quantidade total de sensores cadastrados -->
                    <label class="form-label mb-0" style="color: #fff; font-size: 0.9rem;">Quantidade Produtos:
                        <strong>{{ sensor }}</strong></label>

                    <label class="form-label mb-0 mt-1" style="color: #fff; font-size: 0.85rem;"></label>
                    <span style="color: #fff; font-size: 1.8rem; font-weight: bold; line-height: 1;">

                    </span>
                </div>
            </div>
        </div>

    </div>
</div>
<div class="d-flex colum mt-4" style=" border-radius: 15px;background: rgba(255, 255, 255, 0.15); 
    padding: 5px;max-width:1350px !important; width: 100% !important;height: 450px;">
    <label style=" margin-left: 0 !important; align-self: flex-start; z-index: 1000;"></label>

    <div class="table-responsive mt-3" style="width: 100%;;">
        <table class="table">
            <tr>
                <th class="text-white text-start">Nome</th>
                <th class="text-white fw-bold">Categoria</th>
                <th class="text-white">Quantidade</th>
            </tr>
            {% for produto in produtos %}
            <tr class="linha-produto" data-categoria="{{ produto.produto_categoria }}">
                <th class="text-white fw-normal align-items-start text-start">{{ produto.produto_nome }}</th>
                <th class="text-white fw-normal">{{ produto.produto_categoria }}</th>
                <th class="text-white fw-normal">{{ produto.estoque_quantidade }}</th>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock%}
