{% block conteudo %}

        <!-- =================================================
             CARD SENSOR
        ================================================== -->

        <div class="me-4 card-dash"

<!-- =====================================================
     ÁREA DE FILTROS E TABELA
===================================================== -->

<div class="mt-5"
    style="
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
        padding: 5px;
        min-height: 450px;
    ">


    <!-- =================================================
         FILTROS
    ================================================== -->

    <form id="form-filtros">

        <div class="container-fluid px-4 py-3">

            <div class="row g-3 align-items-end">


                <!-- =================================================
                     FILTRO NOME
                ================================================== -->

                <div class="col">

                    <label class="text-white fw-bold mb-2">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="filtro-nome"
                        name="nome"
                        class="form-control rounded-3"
                        placeholder="Buscar por nome"
                    >

                </div>


                <!-- =================================================
                     FILTRO CATEGORIA
                ================================================== -->

                <div class="col">

                    <label class="text-white fw-bold mb-2">
                        Categoria
                    </label>

                    <select
                        id="filtro-categoria"
                        name="categoria"
                        class="form-select rounded-3"
                    >

                        <option value="">
                            Todas as categorias
                        </option>

                        <option value="Vacina">
                            Vacina
                        </option>

                        <option value="Antiparasitários">
                            Antiparasitários
                        </option>

                        <option value="Antibióticos">
                            Antibióticos
                        </option>

                        <option value="Anti-inflamatórios">
                            Anti-inflamatórios
                        </option>

                        <option value="Analgésicos">
                            Analgésicos
                        </option>

                        <option value="Anestésicos">
                            Anestésicos
                        </option>

                        <option value="Animais">
                            Animais
                        </option>

                        <option value="Sensores">
                            Sensores
                        </option>

                    </select>

                </div>


                <!-- =================================================
                     FILTRO QUANTIDADE
                ================================================== -->

                <div class="col-auto">

                    <label class="text-white fw-bold mb-2">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="filtro-quantidade"
                        name="quantidade"
                        class="form-control rounded-3"
                        placeholder="Quantidade"
                        style="width: 150px;"
                    >

                </div>


                <!-- =================================================
                     BOTÃO FILTRAR
                ================================================== -->

                <div class="col-auto">

                    <button
                        type="submit"
                        class="btn btn-light rounded-3 px-4 fw-bold"
                    >
                        Filtrar
                    </button>

                </div>


                <!-- =================================================
                     BOTÃO LIMPAR
                ================================================== -->

                <div class="col-auto">

                    <button
                        type="button"
                        id="btn-limpar"
                        class="btn btn-outline-light rounded-3 px-4 fw-bold"
                    >
                        Limpar
                    </button>

                </div>

            </div>

        </div>

    </form>


    <!-- =====================================================
         TABELA
    ===================================================== -->

    <div class="table-responsive mt-4">

        <table class="table">

            <thead>

                <tr>

                    <th
                        class="texto-p text-start"
                        style="width: 39%;"
                    >
                        Nome Produto
                    </th>

                    <th
                        class="texto-p text-start"
                        style="width: 38%;"
                    >
                        Categoria
                    </th>

                    <th
                        class="texto-p text-start"
                        style="width: 12%;"
                    >
                        Quantidade
                    </th>

                </tr>

            </thead>


            <tbody id="tabela-produtos">

                <tr>

                    <td
                        colspan="3"
                        class="text-center text-white py-4"
                    >
                        Carregando produtos...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

async function buscarProdutos() {

    // -------------------------------------------------
    // PEGAR VALORES DOS FILTROS
    // -------------------------------------------------

    const nome =
        document.getElementById("filtro-nome").value.trim();

    const categoria =
        document.getElementById("filtro-categoria").value;

    const quantidade =
        document.getElementById("filtro-quantidade").value;


    // -------------------------------------------------
    // MONTAR URL DA API
    // -------------------------------------------------

    const parametros = new URLSearchParams();


    if (nome !== "") {

        parametros.append("nome", nome);

    }


    if (categoria !== "") {

        parametros.append("categoria", categoria);

    }


    if (quantidade !== "") {

        parametros.append("quantidade", quantidade);

    }


    const url =
        "/api/relatorio?" + parametros.toString();


    console.log("URL chamada:", url);


    // -------------------------------------------------
    // MOSTRAR CARREGANDO
    // -------------------------------------------------

    const tabela =
        document.getElementById("tabela-produtos");


    tabela.innerHTML = `

        <tr>

            <td
                colspan="3"
                class="text-center text-white py-4"
            >
                Carregando...
            </td>

        </tr>

    `;


    try {

        // -------------------------------------------------
        // CHAMAR API
        // -------------------------------------------------

        const resposta = await fetch(url);


        // -------------------------------------------------
        // VERIFICAR ERRO HTTP
        // -------------------------------------------------

        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP: " + resposta.status
            );

        }


        // -------------------------------------------------
        // CONVERTER PARA JSON
        // -------------------------------------------------

        const dados = await resposta.json();


        console.log("Resposta da API:", dados);


        // -------------------------------------------------
        // VERIFICAR SUCESSO
        // -------------------------------------------------

        if (!dados.sucesso) {

            throw new Error(
                dados.mensagem || "Erro na API"
            );

        }


        // -------------------------------------------------
        // LIMPAR TABELA
        // -------------------------------------------------

        tabela.innerHTML = "";


        // -------------------------------------------------
        // NENHUM PRODUTO
        // -------------------------------------------------

        if (
            !dados.produtos ||
            dados.produtos.length === 0
        ) {

            tabela.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="text-center text-white py-4"
                    >
                        Nenhum produto encontrado.
                    </td>

                </tr>

            `;

            return;

        }


        // -------------------------------------------------
        // PREENCHER TABELA
        // -------------------------------------------------

        dados.produtos.forEach(function(produto) {

            const linha =
                document.createElement("tr");


            linha.innerHTML = `

                <td class="texto-p text-start">
                    ${produto.produto_nome}
                </td>

                <td class="texto-p text-start">
                    ${produto.produto_categoria}
                </td>

                <td class="texto-p text-start">
                    ${produto.estoque_quantidade}
                </td>

            `;


            tabela.appendChild(linha);

        });

    }

    catch (erro) {

        console.error(
            "Erro ao buscar produtos:",
            erro
        );


        tabela.innerHTML = `

            <tr>

                <td
                    colspan="3"
                    class="text-center text-danger py-4"
                >
                    Erro ao buscar os produtos.
                </td>

            </tr>

        `;

    }

}


// =====================================================
// FORMULÁRIO
// =====================================================

document
    .getElementById("form-filtros")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        buscarProdutos();

    });


// =====================================================
// BOTÃO LIMPAR
// =====================================================

document
    .getElementById("btn-limpar")
    .addEventListener("click", function() {

        document.getElementById("filtro-nome").value = "";

        document.getElementById("filtro-categoria").value = "";

        document.getElementById("filtro-quantidade").value = "";

        buscarProdutos();

    });


// =====================================================
// CARREGAR PRODUTOS AO ABRIR
// =====================================================

document.addEventListener("DOMContentLoaded", function() {

    buscarProdutos();

});

</script>


{% endblock %}
