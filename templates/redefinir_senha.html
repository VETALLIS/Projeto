<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link rel="stylesheet" href="/static/style2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <section class="d-flex justify-content-center align-items-center flex-column min-vh-100">
        <div class="container mt-5">
            <h3 class="d-flex text-white justify-content-center alaing-items-center mb-3">
                REDEFINIR SENHA
            </h3>
        </div>
        <form action="">
            <div class="otp-container d-flex justify-content-center mb-4">
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" autofocus />
                    <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                </div>
                <a href="#" class="resend-link text-white">Reenviar código</a>
            </div>
            <div>
                <button class="btn background-verde-medio text-white w-100 border-radius-maior">
                    Enviar
                </button>
            </div>
        </form>
    </section>
</body>
<script>
    const inputs = document.querySelectorAll('.otp-box');

    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        });

        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').trim();

            if (pastedData.length === inputs.length) {
                pastedData.split('').forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                    }
                });
                inputs[inputs.length - 1].focus();
            }
        });
    });
</script>

</html>
