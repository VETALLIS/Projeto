<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link rel="stylesheet" href="/static/style2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <section class="container d-flex align-items-center justify-content-center height-maior">

        <div
            class="login-card position-relative backgroud-glass text-center border-radius-menor d-flex justify-content-center alaing-items-center flex-column ">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for categoria, mensagem in messages %}
            <div class="alert alert-primary alert-{{categoria}} alert-dismissible fade show border border-{{categoria}}-subtle border-2"
                role="alert">
                <i class="bi bi-info-circle-fill"></i>
                <strong>{{ mensagem }}</strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <div class="text-start mb-3">
                <a href="{{url_for('pegar_email_salvar')}}" class="bi bi-arrow-bar-left texto-a">Voltar</a>
            </div>

            <div class="container ">
                <h3 class="d-flex text-white justify-content-center alaing-items-center ">
                    REDEFINIR SENHA
                </h3>
                <p class="text-white-50 fs-8">Insira o código recebido no seu email</p>
            </div>
            <form action="/redefinir-senha/codigo" method="POST">
                <div class="otp-container d-flex justify-content-center mb-4">
                    <div class="otp-inputs">

                        <input type="hidden" name="codigo" id="codigo-completo">
                        <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric"
                            autofocus />
                        <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                        <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                        <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                        <input type="text" maxlength="1" class="otp-box" pattern="[0-9]*" inputmode="numeric" />
                    </div>
                    <a href="#" class="resend-link text-white">Reenviar código</a>
                </div>
                <div>
                    <button class="btn background-verde-medio text-white w-100 border-radius-maior">
                        Enviar
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>
<script>
    const inputs = document.querySelectorAll('.otp-box');

    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {

            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }


            let codigoCompleto = '';

            inputs.forEach(item => {
                codigoCompleto += item.value;
            });

            const hiddenInput = document.getElementById('codigo-completo');


            if (hiddenInput) {
                hiddenInput.value = codigoCompleto;
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        });

        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').trim();

            if (pastedData.length === inputs.length) {
                pastedData.split('').forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                    }
                });
                inputs[inputs.length - 1].focus();


                let codigoCompleto = '';
                inputs.forEach(item => codigoCompleto += item.value);
                const hiddenInput = document.getElementById('codigo-completo');
                if (hiddenInput) {
                    hiddenInput.value = codigoCompleto;
                }
            }
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
