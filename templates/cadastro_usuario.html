{%extends 'base.html'%}
{%block conteudo%}

<h3 class="mb-4 text-start" style="color: white; padding:10px; border-bottom:solid 1px #fff;">Cadastro de funcionarios
</h3>


{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for categoria, mensagem in messages %}
<div class="alert alert-{{ categoria }} text-center w-75 mx-auto" role="alert">
    {{ mensagem }}
</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST" class="d-flex" action="/usuario/salvar">
    <div class="upload-imagem me-5 ">
        <label for="imagem_produto" class="upload-box"
            style="margin-left: 0 !important; cursor: pointer; overflow: hidden; position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center;">
            <img id="preview_imagem" src="" alt=""
                style="display:none; width:250px; height:400px; object-fit:cover; border-radius:10px; position:absolute; top:0; left:0;">
            <span id="texto_upload" class="text-white" style="text-align:center; z-index:1;">Clique para
                adicionar imagem</span>
            <div id="icone_trocar"
                style="display:none; position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.5); border-radius:50%; width:32px; height:32px; display:none; align-items:center; justify-content:center; z-index:2;">
                <i class="bi bi-pencil text-white  " style="font-size:14px;"></i>
            </div>
        </label>

        <input type="file" id="imagem_produto" name="imagem" accept="image/*" class="d-none">
        <input type="hidden" id="usuario_id" name="usuario_usuario_id" value="">
    </div>

    <div class="w-100 mt-2">
        <div class="d-flex gap-2">
            <div class="mb-2 text-start w-100 ">
                <div class="input-group ">
                    <input type="text" name="nome"  class="dados_formulario form-control" placeholder="Digite seu nome"
                        required>
                </div>
            </div>
            <div class="mb-2 text-start w-100">
                <div class="input-group">
                    <input type="email" name="email" class="dados_formulario form-control"
                        placeholder="Digite seu email" required>
                </div>
            </div>
            <div class="mb-2 text-start w-100">
                <div class="input-group">
                    <input type="text" name="cpf" class="dados_formulario form-control" placeholder="Digite seu CPF"
                        required>
                </div>
            </div>
        </div>
        <div class="d-flex gap-2 w-100">
            <div class="mb-2 text-start w-100">
                <div class="input-group">
                    <input type="password" name="senha" class="dados_formulario form-control"
                        placeholder="Crie uma senha" required>
                </div>
            </div>
            <div class="mb-2 text-start w-100">
                <div class="input-group">
                    <input type="password" name="confirmar_senha" class="dados_formulario form-control"
                        placeholder="Confirme sua senha" required>
                </div>
            </div>
        </div>
        <div class="mb-2 text-start">
            <div class="input-group">
                <input type="text" name="cargo" class="dados_formulario form-control" placeholder="Insira seu cargo."
                    required>
            </div>
        </div>

        <button class="btn btn-cadastro w-100 text-white mt-2" style=" background: #03c356; border-radius: 25px;"
            type="submit" id="botao-cadastro">Cadastrar</button>
    </div>
</form>

{%endblock%}
