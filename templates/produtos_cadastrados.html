{% extends 'base.html'%}
{% block conteudo%}
<h3 class="mb-4 text-start" style="color: white; padding:5px; border-bottom:solid 1px #fff; margin-top: -23px;">Produtos
</h3>


<div class="d-flex flex-wrap justify-content-start" style=" gap: 20px; ">
    {%if produtos %}
    {% for produto in produtos %}

    <div class="card mb-3 text-white m-3"
        style="max-width: 25%; background-color: rgba(255, 255, 255, 0.05); border-radius: 13px; box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2); min-height: 120px; position: relative;">


    <div class="me-2" style=" border-radius: 13px;">
        <label for="imagem_produto" class="upload-box" style="max-height:120px !important; width: 120px; margin-left: 0 !important; align-self: flex-start; z-index: 1000;">
            <img src="data:{{produto.imagem_tipo}};base64,{{produto.imagem_base64}}" 
     style="max-height:120px; width:120px; border-radius:10px; object-fit:cover;">
        </label>
        <div class="d-flex">
            <label class="form-label" style="color: #fff;font-weight: bold; font-size: 15px; ">Nome:</label>
            <label for="" class="d-nome" style="color: #fff;">{{produto.produto_nome}}</label>
        </div>
        <div class="d-flex justify-content-between align-items-center w-100">
            <a href="/informacao_produto/{{produto.produto_id}}" class="bi bi-arrow-bar-right text-white"
                style="text-decoration: none;">
                Ver Detalhes
            </a>
            <a href="/produto/editar/{{produto.produto_id}}" class="bi bi-pencil-square text-white"
                style="text-decoration: none;">
                Editar
            </a>
            <a class="btn btn-sm btn-link text-danger"
                href="{{url_for('excluir_produto', produto_id=produto.produto_id)}}">
                <i class="bi bi-trash"></i>
            </a>
        </div>


    </div>


    {% endfor %}
    {% endif %}
</div>
<script>
    localStorage.setItem("produtos", JSON.stringify({
        id: "{{ produtos.produto_id}}",
        nome: "{{produtos.produto_nome}}"
    }))
</script>

{% endblock%}
