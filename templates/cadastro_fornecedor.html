{% extends 'base.html'%}
{% block conteudo%}


<div class="d-flex justify-content-start">
    <a href="" class="bi bi-arrow-bar-left text-white" style="text-decoration: none;">Voltar</a>
</div>
<h3 class="mb-4 mt-3 text-start" style="color: white; padding:5px; border-bottom:solid 1px #fff;">Cadastro de Fornecedor
</h3>

<form method="POST" action="{{ url_for('gravar_fornecedor') }}" class="form-sensor " style="width: 100%;">

    <div class="divisao-form d-flex" >

        <div class="mb-4 text-start m-2" style="width: 33%;">
            <div class="input-group">
                <input type="name" name="fornecedor_nome" class="form-control" placeholder="Nome do fornecedor:"
                    required>
            </div>
        </div>
        <div class="mb-4 text-start" style="width: 33%;">
            <div class="input-group">
                <input type="text" name="fornecedor_tipo_produtos" class="form-control" placeholder="Tipo de Produto:"
                    required>
            </div>
        </div>
        <div class="mb-4 text-start"  style="width: 33%;">
            <div class="input-group">
                <input type="number" name="fornecedor_pedido_minimo" class="form-control" placeholder="Pedido Mínimo:"
                    required>
            </div>
        </div>

        

    </div>
    <div class="divisao-form " style=" width: 50%;">

        <div class="mb-4 text-start">
            <div class="input-group">
                <input type="text" name="fornecedor_endereço" class="form-control" placeholder="Endereço:" required>
            </div>
        </div>

        <div class="mb-4 text-start">
            <div class="input-group">
                <input type="text" name="fornecedor_cnpj" class="form-control" placeholder="CNPJ:" required>
            </div>
        </div>
        <div class="mb-4 text-start">
            <div class="text-center">
                <button class="btn btn-login text-white "
                    style="background: #03c356; border-radius: 15px; width: 50%;" type="submit">Cadastrar</button>
            </div>
        </div>

    </div>

</form>



<div class="text-start">
    <a href="gravar_fornecedor" class="bi bi-arrow-bar-left texto-a">Voltar</a>
</div>
<h3 class="mb-4 text-start titulo-h3 mt-4">Cadastro de
    Fornecedor</h3>

<form method="POST" action="{{ url_for('salvar_animal') }}" class="form-sensor">
    <div class="cadastro-sensor d-flex mt-4">
        <div class="divisao-form me-4 w-100" >
            <div class="mb-3 text-start">
                <div class="input-group">
                    <input type="name" name="especie" class="form-control" placeholder="Espécie:" required>
                </div>
            </div>

            <div class="mb-3 text-start">
                <div class="input-group">
                    <input type="text" name="sexo" class="form-control" placeholder="Sexo: " required>
                </div>
            </div>

            <div class="mb-3 text-start">
                <div class="input-group">
                    <input type="text" name="faixa_etaria" class="form-control" placeholder="Idade:" required>
                </div>
            </div>
        </div>
        <div class="w-100">
            <div class="mb-3 text-start">
                <div class="input-group">
                    <input type="text" name="raca" class="form-control" placeholder="Raça:" required>
                </div>
            </div>

            <div class="mb-3 text-start">
                <div class="input-group">
                    <input type="text" name="identificacao_animal" class="form-control"
                        placeholder="Identificação de animal:" required>
                </div>
            </div>
            <div class="text-center">
                <button class="btn w-100 texto-a background-verde-medio border-radius-menor" type="submit">Cadastrar</button>
            </div>

        </div>
    </div>

</form>


{% endblock %}
