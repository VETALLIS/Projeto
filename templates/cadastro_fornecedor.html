{% extends 'base.html'%}
{% block conteudo%}

<div class="d-flex justify-content-start">
    <a href="{{url_for('fornecedor_novo')}}" class="bi bi-arrow-bar-left texto-a">Voltar</a>
</div>
<h3 class="mb-4 mt-3 text-start titulo-h3">Cadastro de Fornecedor</h3>

<form method="POST" action="{{ url_for('gravar_fornecedor') }}" class="form-sensor w-100">

    <div class="divisao-form d-flex w-100 gap-3 mb-3">
        <div class="text-start w-50">
            <div class="input-group">
                <input type="text" name="fornecedor_nome" class="form-control" placeholder="Nome do fornecedor:"
                    required>
            </div>
        </div>
        <div class="text-start w-50">
            <div class="input-group">
                <input type="text" name="fornecedor_tipo_produtos" class="form-control" placeholder="Tipo de Produto:"
                    required>
            </div>
        </div>
    </div>

    <div class="divisao-form d-flex w-100 gap-3 mb-3">
        <div class="text-start w-50">
            <div class="input-group">
                <input type="number" name="fornecedor_pedido_minimo" class="form-control" placeholder="Pedido Mínimo:"
                    required>
            </div>
        </div>
        <div class="text-start w-50">
            <div class="input-group">
                <input type="text" name="fornecedor_endereço" class="form-control" placeholder="Endereço:" required>
            </div>
        </div>
    </div>

    <div class="divisao-form d-flex w-100 gap-3 mb-3">
        <div class="text-start w-50">
            <div class="input-group">
                <input type="text" name="fornecedor_cnpj" class="form-control" placeholder="CNPJ:" required>
            </div>
        </div>
        <div class="text-start w-50">
            <button class="btn btn-login text-white background-verde-medio border-radius-menor w-100" type="submit">
                Cadastrar
            </button>
        </div>
    </div>

</form>

{% endblock %}
