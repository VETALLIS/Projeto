<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetallis</title>
    <link rel="stylesheet" href="/static/style2.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <main>
        <div class="container d-flex  align-items-center justify-content-center height-maior">
            <img src="/static/imagens/vetalis_branca_sem_fundo.png" alt="logo vetallis"
                class="logo-login position-absolut">
            <div class="login-card position-relative backgroud-glass text-center border-radius-menor ">

                <h3 class="mb-3 titulo-h3">Sistema de Estoque</h3>
                <h5 class="mb-4 texto-p">Acesse sua conta</h5>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for categoria, mensagem in messages %}
                <div class="alert alert-primary alert-{{categoria}} alert-dismissible fade show border border-{{categoria}}-subtle border-2"
                    role="alert">
                    <i class="bi bi-info-circle-fill"></i>
                    <strong>{{ mensagem }}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <form method="POST" action="/login/salvar">
                    <div class="mb-3 text-start">
                        <label class="form-label texto-p fs-5">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-white">
                                <i class="bi bi-person-fill text-white"></i>
                            </span>
                            <input type="email" name="email" class="form-control" placeholder="Digite seu email"
                                required>
                        </div>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label texto-p fs-5">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-white">
                                <i class="bi bi-lock-fill text-white"></i>
                            </span>
                            <input type="password" name="senha" class="form-control" placeholder="Digite sua senha"
                                required>
                        </div>
                    </div>
                    <input type="checkbox" name="" id="" class="form-label align-items-center text-white"><label
                        for="lemabrar"> Lembre-me </label>
                    <button
                        class="btn btn-login w-100 text-white mt-2 mb-2 fs-5 background-verde-medio border-radius-maior"
                        type="submit">Entrar</button>
                    <a class=" position-relative mt-4 fs-6 texto-a">Esqueceu a
                        senha</a>

                </form>

                <div class="mt-4 texto-p " >
                    © 2026 Vetallis - Sistema de Estoque
                </div>
            </div>
        </div>
    </main>
</body>
<script>
    localStorage.removeItem("usuario");
</script>

</html>
