<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link rel="stylesheet" href="/static/style2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <section class="container d-flex align-items-center justify-content-center height-maior">

        <div
            class="login-card position-relative backgroud-glass text-center border-radius-menor d-flex justify-content-center alaing-items-center flex-column ">
            <div class="text-start mb-3">
                <a href="{{url_for('novo_login')}}" class="bi bi-arrow-bar-left texto-a">Voltar</a>
            </div>

            <div class="container ">
                <h3 class="d-flex text-white justify-content-center alaing-items-center ">
                    REDEFINIR SENHA
                </h3>
                <p class="text-white-50 fs-8">Digite seu email para enviarmos um código de verificação</p>
            </div>
            <form action="/redefinir-senha/email/salvar" method="POST" class="w-100 mx-auto" id="form-recuperar-senha">
                <div class="otp-container  mb-4 w-100">
                    <input type="text" placeholder="Digite seu email:" class="form-control w-100 border-radius-menor"
                        name="email">
                </div>
                <div>
                    <button class="btn background-verde-medio text-white w-100 border-radius-maior">
                        Enviar
                    </button>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
