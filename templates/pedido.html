{% extends 'base.html'%}
{%block conteudo%}

<!-- Fora da lista ordenada há a ancoragem de voltar para outras telas além da titulagem da tela como tela de Pedidos -->
<div class="d-flex justify-content-start">
    <a href="{{url_for('pedidos_cadastrados')}}" class="bi bi-arrow-bar-left texto-a mb-3">Voltar</a>
</div>
<h3 class="text-start titulo-h3 mb-3">
    Pedidos</h3>


    <!-- Container que cria a barra de abas do Bootstrap -->
<ul class="nav nav-tabs mb-3 w-100" id="tipoPedido" role="tablist">
    <li class="nav-item" role="presentation">
        <!-- Botão que exibe o conteúdo da div #entrada -->
        <button class="nav-link active text-black" data-bs-toggle="tab" data-bs-target="#entrada" type="button "
            onclick="
                this.style.color='#074040';
                document.querySelector('[data-bs-target=\'#entrada\']').style.color='black';
            ">
            Entrada
        </button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link text-black" data-bs-toggle="tab" data-bs-target="#saida" type="button" onclick="
                this.style.color='#074040';
                document.querySelector('[data-bs-target=\'#saida\']').style.color='black';
            ">
            Saída
        </button>
    </li>
</ul>

<!-- Div feita para colocar o html das duas abas, mesmo que haja a possibilidade de selecionar qual aba (entrada ou saída) será utilizada -->
<div class="w-100">
    <div class="tab-content">

        <!-- ABA ENTRADA- html da aba da parte de pedido de entrada com o método POST já que é um "cadastro" de um novo pedido-->
        <div class="tab-pane fade show active w-100" id="entrada">
            <!-- formulário que usa o método POST com a função -->
            <form method="POST" action="{{url_for('pedido_salvar')}}">
                <input type="hidden" name="tipo_movimentacao" value="entrada">
                <input type="hidden" name="pedido_entrada_status" value="Concluido">
                <div class="me-3 w-100">
                    <div class="d-flex w-100 gap-3">

                        <div class="mb-4 w-100">
                            <input type="text" name="pedido_entrada_nome" class="form-control" placeholder="Nome:" required>
                        </div>
                        <div class="mb-4 w-100">
                            <select name="fornecedor_fornecedor_id" class="form-select">
                                <option value="" > Selecione um fornecedor</option>
                                {% for f in fornecedor%}
                                <option value="{{ f.fornecedor_id }}" class="text-black">{{ f.fornecedor_nome }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-4 w-100">
                            <input type="date" name="pedido_entrada_data" class="form-control" placeholder="Data:" required>
                        </div>
                    </div>

                </div>

                <div class="d-flex justify-content-between p-2 border-bottom">
                    <h3 class="text-start text-white">Item do Pedido</h3>
                    <button type="button"
                        class="btn  btn-adicionar-item background-verde-medio text-white border-radius-menor"
                        data-template="templateItemEntrada" data-corpo="corpoItensEntrada">
                        Adicionar Item
                    </button>
                </div>

                <div class="table-responsive mt-2">
                    <table class="table">
                        <thead>
                            <tr>
                                <th class="text-white text-center w-25">Produto</th>
                                <th class="text-white text-center w-25">Lote</th>
                                <th class="text-white text-center w-25">Quantidade</th>
                                <th class="text-white text-center w-25">Valor Unitário</th>
                                <th class="text-white text-center w-25">Validade</th>
                                <th class="text-white text-center w-25">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpoItensEntrada"></tbody>
                    </table>
                </div>


                <!-- Template separada para a parte de itens do pedido de entrada , com selects ara seleção de produtos ja cadastrados -->
                <template id="templateItemEntrada">
                    <tr>
                        <td>
                            <select name="produto_produto_id" class="form-select">
                                <option value=""> Selecione o produto</option>
                                {% for p in produtos%}
                                <option value="{{ p.produto_id }}" class="text-black">{{
                                    p.produto_nome }}
                                </option>
                                {% endfor %}
                            </select>
                        </td>
                        <td class="text-center">
                            <input type="text" name="item_pedido_entrada_lote"
                                class=" form-control border-0 form w-100 text-center" placeholder="Lote">
                        </td>
                        <td class="text-center">
                            <input type="number" name="item_pedido_entrada_quantidade"
                                class="form-control border-0 form w-100 text-center" placeholder="0" min="0" step="1">
                        </td>
                        <td class="text-center">
                            <input type="number" name="item_pedido_entrada_valor_unitario"
                                class="form-control border-0 form w-100 text-center" placeholder="0.0" min="0"
                                step="0.1">
                        </td>
                        <td class="text-center"><input type="date" name="item_pedido_entrada_validade"
                                class="form-control border-0 form w-100 text-center"></td>
                        <td class="text-center"><button role="img" title="Botão de excluir item" type="button" class="btn btn-sm btn-danger"
                                onclick="removerLinha(this)">X</button></td>
                    </tr>
                </template>

                <div class="mt-3">
                    <button
                        class="btn btn-login w-100 text-white ms-auto background-verde-medio border-radius-menor w-100"
                        type="submit">Enviar</button>
                </div>
            </form>
        </div>

        <!-- ABA saída- html da aba da parte de pedido de entrada com o método POST já que é um "cadastro" de um novo pedido-->
        <div class="tab-pane fade" id="saida">
            <!-- formulário que usa o método POST com a função -->
            <form method="POST" action="{{url_for('pedido_salvar')}}" class="w-100">
                <input type="hidden" name="tipo_movimentacao" value="saida">
                <input type="hidden" name="pedido_saida_status" value="Concluido">

                <div class="me-3 w-100">
                    <div class="d-flex gap-3 w-100">
                        <div class="mb-4 w-100">
                            <input type="text" name="pedido_saida_nome" class="form-control" placeholder="Nome:">
                        </div>
                        <div class="mb-4 w-100">
                            <select name="animal_animal_id" class="form-select">
                                <option value=""> Selecione um animal</option>
                                {% for f in animal%}
                                <option value="{{ f.animal_id }}" class="text-black">{{ f.animal_identificacao }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-4 w-100">
                            <input type="date" name="pedido_saida_data" class="form-control" placeholder="Data:">
                        </div>
                    </div>

                </div>

                <div class="d-flex justify-content-between p-2 w-100 border-bottom">
                    <h3 class="text-start text-white">Item do Pedido</h3>
                    <button type="button"
                        class="btn background-verde-medio border-radius-menor text-white btn-adicionar-item"
                        data-template="templateItemSaida" data-corpo="corpoItensSaida">
                        Adicionar Item
                    </button>
                </div>

                <div class="table-responsive mt-2">
                    <table class="table">
                        <thead>
                            <tr>
                                <th class="text-white text-center w-50">Produto</th>
                                <th class="text-white text-center w-25">Lote</th>
                                <th class="text-white text-center w-25">Quantidade</th>
                                <th class="text-white text-center w-100">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpoItensSaida">
                        </tbody>
                    </table>
                </div>

                <!-- Template separada para a parte de itens do pedido de saída , com selects ara seleção de produtos ja cadastrados -->
                <template id="templateItemSaida">
                    <tr>
                        <td>
                            <select name="produto_produto_id" class="form-select">
                                <option value=""> Selecione o produto</option>
                                {% for p in produtos%}
                                <option value="{{ p.produto_id }}" data-estoque="{{ p.estoque_quantidade | int }}" class="text-black">{{ p.produto_nome }}</option>
                                {% endfor %}
                            </select>
                            <small class="estoque-atual text-white-50 d-block mt-1 text-start"></small>
                        </td>
                        <td>
                            <select name="item_pedido_saida_lote" class="form-select">
                                <option value=""> Selecione um lote</option>
                                {% for i in lote%}
                                <option value="{{ i.item_pedido_entrada_id }}" class="text-black">{{
                                    i.item_pedido_entrada_lote }}
                                </option>
                                {% endfor %}
                            </select>
                        </td>
                        <td><input type="number" name="item_pedido_saida_quantidade"
                                class="form-control border-0 form w-100 text-center" placeholder="0" min="1" step="1">

                        </td>
                        <td class="text-center">
                            <button role="img" title="Botão de excluir item" type="button" class="btn btn-sm btn-danger" onclick="removerLinha(this)">X</button>
                        </td>
                    </tr>
                </template>
                <style>

                </style>

                <div class="mt-3">
                    <button class="btn btn-login text-white ms-auto background-verde-medio border-radius-menor w-100"
                        type="submit">Enviar</button>
                </div>
            </form>
        </div>

    </div>
</div>
<script>
    // Clona e adiciona um novo item a partir de um <template> HTML
    function adicionarItem(templateId, corpoId) {
        const template = document.getElementById(templateId);
        const corpo = document.getElementById(corpoId);
        const novaLinha = template.content.cloneNode(true);
        corpo.appendChild(novaLinha);
    }

    // Remove a linha (<tr>) correspondente ao botão de exclusão clicado
    function removerLinha(botao) {
        botao.closest("tr").remove();
    }

    // ===== Saída com tag RFID ===== //

    // Mostra embaixo do select o estoque atual do produto escolhido
    function atualizarEstoqueDaLinha(linha) {
        const select = linha.querySelector('select[name="produto_produto_id"]');
        const aviso = linha.querySelector(".estoque-atual");
        if (!select || !aviso) {
            return;
        }
        const opcao = select.options[select.selectedIndex];
        if (opcao && opcao.value && opcao.dataset.estoque !== undefined) {
            aviso.textContent = "Estoque atual: " + opcao.dataset.estoque;
        } else {
            aviso.textContent = "";
        }
    }

    // Data de hoje no formato do campo date (AAAA-MM-DD), usando o horário local
    function dataDeHoje() {
        const hoje = new Date();
        const mes = String(hoje.getMonth() + 1).padStart(2, "0");
        const dia = String(hoje.getDate()).padStart(2, "0");
        return hoje.getFullYear() + "-" + mes + "-" + dia;
    }

    // Abre a aba de saída
    function abrirAbaSaida() {
        const botao = document.querySelector('[data-bs-target="#saida"]');
        if (botao) {
            botao.click();
        }
    }

    // Preenche a saída com o produto da tag lida. O usuário completa animal, lote e quantidade.
    // Também é chamada pelo script do base.html quando uma tag é lida com esta tela aberta.
    window.aoLerTagSaida = function (produto) {
        abrirAbaSaida();

        const corpo = document.getElementById("corpoItensSaida");
        let linhaAlvo = null;
        let jaExiste = false;

        // Se o produto já está em alguma linha, só usa essa linha
        corpo.querySelectorAll("tr").forEach(function (linha) {
            const select = linha.querySelector('select[name="produto_produto_id"]');
            if (select && select.value === String(produto.id)) {
                linhaAlvo = linha;
                jaExiste = true;
            }
        });

        // Senão, procura uma linha ainda sem produto
        if (!linhaAlvo) {
            corpo.querySelectorAll("tr").forEach(function (linha) {
                const select = linha.querySelector('select[name="produto_produto_id"]');
                if (!linhaAlvo && select && !select.value) {
                    linhaAlvo = linha;
                }
            });
        }

        // Se não há linha livre, cria uma nova
        if (!linhaAlvo) {
            adicionarItem("templateItemSaida", "corpoItensSaida");
            linhaAlvo = corpo.lastElementChild;
        }

        if (!jaExiste) {
            const select = linhaAlvo.querySelector('select[name="produto_produto_id"]');
            select.value = String(produto.id);
            atualizarEstoqueDaLinha(linhaAlvo);
        }

        // Sugere o nome e a data se ainda estiverem vazios
        const campoNome = document.querySelector('#saida input[name="pedido_saida_nome"]');
        if (campoNome && !campoNome.value) {
            campoNome.value = "Saída - " + produto.nome;
        }

        const campoData = document.querySelector('#saida input[name="pedido_saida_data"]');
        if (campoData && !campoData.value) {
            campoData.value = dataDeHoje();
        }

        // Leva o cursor para a quantidade (pequena espera por causa da animação da aba)
        const quantidade = linhaAlvo.querySelector('input[name="item_pedido_saida_quantidade"]');
        if (quantidade) {
            setTimeout(function () { quantidade.focus(); }, 300);
        }
    };

    // Inicializa o comportamento da página após o carregamento completo do HTML
    document.addEventListener("DOMContentLoaded", function () {
        // Insere automaticamente a primeira linha padrão tanto na Entrada quanto na Saída
        adicionarItem("templateItemEntrada", "corpoItensEntrada");
        adicionarItem("templateItemSaida", "corpoItensSaida");

        // Vincula o evento de clique em todos os botões de adicionar itens da tela
        document.querySelectorAll(".btn-adicionar-item").forEach(function (botao) {
            botao.addEventListener("click", function () {
                const templateId = this.dataset.template;
                const corpoId = this.dataset.corpo;
                adicionarItem(templateId, corpoId);
            });
        });

        // Atualiza o estoque mostrado quando o usuário troca o produto de uma linha da saída
        document.getElementById("corpoItensSaida").addEventListener("change", function (evento) {
            if (evento.target.name === "produto_produto_id") {
                atualizarEstoqueDaLinha(evento.target.closest("tr"));
            }
        });

        // Se a tela foi aberta por uma tag RFID, a URL traz o id do produto
        const produtoId = new URLSearchParams(window.location.search).get("produto_id");
        if (produtoId && /^[0-9]+$/.test(produtoId)) {
            const opcao = document.querySelector('#templateItemSaida').content
                .querySelector('option[value="' + produtoId + '"]');
            if (opcao) {
                window.aoLerTagSaida({ id: produtoId, nome: opcao.textContent.trim() });
            }
            // Limpa a URL para um F5 não repetir o preenchimento
            window.history.replaceState({}, "", window.location.pathname);
        }
    });

</script>
{%endblock%}
