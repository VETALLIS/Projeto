{% extends 'base.html'%}
{% block conteudo%}

<div class="d-flex justify-content-start">
    <a href="{{url_for('produtos')}}" class="bi bi-arrow-bar-left texto-a">Voltar</a>
</div>


<h3 class="mb-4 text-start titulo-h3 mt-4">
    Informação de Produto
</h3>

<div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-4">
    <div class="mt-4 w-25">
        <label for="imagem_produto"
            class="ms-0 uploaded-image border-radius-menor align-items-center justify-content-center d-flex position-relative">

            {% if produto.imagem_base64 %}
            <img src="data:{{produto.imagem_tipo}};base64,{{produto.imagem_base64}}"
                class="upload-imagem position-absolute t-0 l-0">
            {%else%}
            <img src="/static/imagens/medicamento.jpg" class="text-white aling-itens-center z-index-1" >
            {%endif%}
        </label>
    </div>

    <div class="mt-4 w-100">

        <!-- Nome -->
        <div class="p-3 mb-3 border-radius-menor backgroud-glass">
            <label class="cinza-texto texto-maiusculo">Nome do produto</label>
            <label class="texto-p d-flex justify-content-center">{{produto.produto_nome}}</label>
        </div>

        <!-- Descrição -->
        <div class="p-3 mb-3 border-radius-menor backgroud-glass">
            <label class="cinza-texto texto-maiusculo">Descrição</label>
            <label class="texto-p d-flex justify-content-center">{{produto.produto_descricao}}</label>
        </div>

        <!-- Localização + Modelo -->
        <div class="row g-3 mb-3">
            <div class="col-6">
                <div class="p-3 mb-3 border-radius-menor backgroud-glass">
                    <label class="cinza-texto texto-maiusculo">Quantidade</label>
                    <label class="texto-p d-flex justify-content-center">{{produto.estoque_quantidade}}</label>
                </div>
            </div>
            <div class="col-6">
                <div class="p-3 mb-3 border-radius-menor backgroud-glass">
                    <label class="cinza-texto texto-maiusculo">Categoria</label>
                    <label class="texto-p d-flex justify-content-center">{{produto.produto_categoria}}</label>
                </div>
            </div>
        </div>


    </div>

</div>

{% endblock %}
