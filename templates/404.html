<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada - 404</title> <!--o que é exibido na tela caso ela não seja encontrada, erro 404-->
  <link rel="stylesheet" href="/static/style2.css"> <!--css do projeto-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!--css bootstrap da tela-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> <!--biblioteca de icones-->
</head>

<body class="d-flex align-items-center min-vh-100"> <!--centraliza verticalmente e define tamanho-->

  <div class="container text-center py-5"> <!--centraliza o texto-->
    <div class="row justify-content-center"> <!--centraliza colunas-->
      <div class="col-md-8 col-lg-6"> <!--tamanho de coluna-->
        <div class="mb-4 text-secondary"> <!--margem inferior e texto-->
          <i class="bi bi-exclamation-triangle-fill display-1 text-warning"></i> <!--icone de alerta, texto grande-->
        </div>

        <h1 class="display-1 fw-bold text-white  mb-0 ">404</h1> <!--exibe a mensagem 404-->
        <h2 class="texto-p mb-4 fw-bold ">Ops! Página não encontrada</h2> <!--exibe a mensagem de erro-->


        <p class="texto-p mb-4"> <!--mensagem de erro-->
          A página que você está procurando pode ter sido removida, renomeada ou está temporariamente indisponível.
        </p>


        <div class="d-flex justify-content-center"> <!--alinha os texto ao centro-->
          <a href="{{ url_for('index') }}" class="btn btn-lg px-4 background-verde-medio borda-none texto-a"> <!--define botão e redireciona ao clicar para a Landingpage-->

            <i class="bi bi-house-door me-2"></i> <!--icone de home-->
            Voltar para o Início <!--exibe a mensagem de volta-->

          </a>
        </div>


      </div>
    </div>
  </div>

</body>

</html>
<!--fechamento-->
