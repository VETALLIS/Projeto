{% extends 'base.html'%}
{% block conteudo %}


<div class="d-flex justify-content-between">
    <h3 class="mb-4 text-start titulo-h3 w-100">Sensores</h3>
    <a role="button" aria-label="Adicionar sensor" class="btn titulo-animal w-100 texto-a d-flex justify-content-center background-verde-medio background-verde-medio border-radius-menor"
        href="{{url_for('novo_sensor')}}">Adicionar Sensor</a>
</div>

<div class="container d-flex entrada-container border-radius-menor row gap-3">
    {% if sensores %}
    {% for sensor in sensores %}
    <div class="card card-sensor mb-3 text-white  backgroud-glass mt-4 border-radius-menor">

        <div class="row">
            <label for="imagem_sensor" class="col-4  p-0 upload-box border-radius-menor sensor-cont-img">
                {% if sensor.imagem_base64 %}
                <img role="img" aria-label="Imagem do sensor" src="data:{{sensor.imagem_tipo}};base64,{{sensor.imagem_base64}}"
                    class="border-radius-menor img-sensor">
                {%else%}
                <img role="img" aria-label="Imagem do sensor" src="/static/imagens/sensor.jpg" class="border-radius-menor img-sensor">
                {%endif%}
            </label>
            <div class="col-8 p-0 ">
                <div class="card-body d-flex gap-1 text-start pb-0">
                    <h5 class="fs-5 titulo-h3">Nome:</h5>
                    <h5 class="card-title fs-6 mt-1">{{sensor.sensor_nome}}</h5>
                </div>
                <div class="card-body text-start pb-0 pt-0">
                    <a role="button" aria-label="Ver detalhes do sensor" href="/sensor/informacao/{{sensor.sensor_id}}" class="bi bi-arrow-bar-right text-white texto-a">
                        Ver Detalhes
                    </a>
                </div>
                <div class="card-body d-flex  align-items-center gap-3 pt-0">
                    <a role="button" aria-label="Excluir sensor" class="btn btn-sm btn-link text-danger fs-5 p-0"
                        href="{{ url_for('excluir_sensor', sensor_id= sensor.sensor_id) }}">
                        <i role="img" aria-label="Botão de excluir sensor" class="bi bi-trash"></i>
                    </a>
                    <a role="button" aria-label="Editar sensor" href="/sensor/editar/{{sensor.sensor_id}}" class="bi bi-pencil text-white texto-a">
                        Editar
                    </a>
                </div>
            </div>
        </div>

    </div>
    {% endfor %}
    {% else %}
    <p class="text-white text-center mt-4">Nenhum sensor cadastrado</p>
    {% endif %}
</div>

{% endblock %}
