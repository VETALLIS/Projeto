ç{% extends 'base.html'%}
{% block conteudo%}

<div class="d-flex justify-content-start">
    <a href="{{url_for('sensor')}}" class="bi bi-arrow-bar-left texto-a">Voltar</a>
</div>
<h3 class="text-start mt-4 mb-4 titulo-h3">
    Cadastro de Sensor
</h3>

<form method="POST" action="{{ url_for('salvar_sensor') }}" enctype="multipart/form-data" class="mt-4">
    <div class="d-flex gap-4">

        <!-- IMAGEM -->
        <div class="borda-dashed  border-radius-menor position-relative d-flex w-25">
            <label for="imagem_produto" ms-0 uploaded-image border-radius-menor align-items-center
                justify-content-center d-flex position-relative>
                <img id="preview" src="" alt="" class="upload-imagem position-absolute t-0 l-0"">
                <span class=" text-white aling-itens-center z-index-1"  id="label_texto">Clique para adicionar
                imagem</span>
            </label>
            <input type="file" id="imagem_produto" name="imagem_produto" accept="image/*" class="d-none">
            <input type="hidden" name="usuario_usuario_id" value="">
        </div>

        <!-- FORMULÁRIO -->
        <div class="d-flex flex-column justify-content-center w-100">
            <div class="d-flex mb-3 gap-3">
                <input type="text" name="sensor_nome" class="form-control w-50" placeholder="Nome:" required>
                <input type="text" name="sensor_tipo_conexao" class="form-control w-50" placeholder="Tipo de conexão:"
                    required>
            </div>

            <div class="d-flex mb-3 gap-3 w-100">
                <div class="d-flex flex-column gap-3 w-50">
                    <textarea name="sensor_descricao" class="form-control w-100" placeholder="Descrição:"
                        style="height: 97px; resize: vertical;"></textarea>
                </div>
                <div class="d-flex flex-column gap-3 w-50">
                    <div class="d-flex gap-4">
                        <input type="text" name="sensor_n_serie" class="form-control" placeholder="N série:" required>
                        <input type="number" name="sensor_voltagem" class="form-control" placeholder="Voltagem:"
                            required>
                    </div>
                    <input type="text" name="sensor_modelo" class="form-control" placeholder="Modelo:" required>
                </div>
            </div>

            <div class="d-flex gap-4 w-100">
                <div class="w-50">
                    <input type="text" name="sensor_localizacao" class="form-control W-100" placeholder="Localização:"
                        required>
                </div>
                <div class="w-50">
                    <button type="submit" class="btn w-100 text-white background-verde-medio border-radius-menor"
                        >Cadastrar</button>
                </div>
            </div>
        </div>

    </div>
</form>

<script>
    document.getElementById("imagem_produto").addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const preview = document.getElementById("preview");
                preview.src = e.target.result;
                preview.style.display = "block";
                document.getElementById("label_texto").style.display = "none";
            };
            reader.readAsDataURL(file);
        }
    });
</script>

{% endblock %}
