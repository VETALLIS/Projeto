{% extends 'base.html'%}
{% block conteudo%}

<div class="d-flex justify-content-start">
    <a href="{{url_for('sensor')}}" class="bi bi-arrow-bar-left texto-a mb-1">Voltar</a>
</div>

<h3 class="mb-4 text-start titulo-h3">
    Editar informações de Sensor
</h3>
<form method="POST" action="{{ url_for('atualizar_sensor', sensor_id=sensor['sensor_id']) }}" class="mt-4"
    enctype="multipart/form-data">
    <div class="d-flex">

        <!-- COLUNA ESQUERDA: IMAGEM -->
        <div class="upload-imagem me-4 mt-3">
            <label for="imagem_sensor"
                class="ms-0 uploaded-image border-radius-menor align-items-center justify-content-center d-flex position-relative overflow-hidden"
                style="max-height: 250px;">
                {% if sensor.imagem_base64 %}
                <img src="data:{{sensor.imagem_tipo}};base64,{{sensor.imagem_base64}}"
                    class="w-100 h-100 object-fit-cover position-absolute top-0 start-0">
                {% else %}
                <img src="/static/imagens/medicamento.jpg" class="w-100 h-100" style="object-fit: cover; z-index:1;">
                {% endif %}
            </label>
            <input type="file" id="imagem_sensor" name="imagem" accept="image/*" class="d-none">
            <p class="mt-3 texto-p text-center">Clique na imagem para alterá-la</p>
        </div>

        <input type="hidden" name="usuario_usuario_id" value="">

        <div class="ms-4 flex-grow-1 mt-4">


            <!-- FORMULÁRIO -->
            <div class="d-flex flex-column justify-content-center w-100">
                <div class="d-flex mb-3 gap-3">
                    <input type="text" name="sensor_nome" class="form-control" value="{{sensor.sensor_nome}}" required>
                    <input type="text" name="sensor_tipo_conexao" class="form-control"
                        value="{{sensor.sensor_tipo_conexao}}" required>
                </div>

                <div class="d-flex mb-3 gap-3 w-100">
                    <div class="d-flex flex-column gap-3 w-50">
                        <textarea name="sensor_descricao" placeholder="Descrição" class="form-control"
                            style="height: 100px; resize: vertical; ">{{sensor.sensor_descricao}}</textarea>
                    </div>
                    <div class="d-flex flex-column gap-3 w-50">
                        <div class="d-flex gap-4">
                            <input type="text" name="sensor_n_serie" class="form-control"
                                value="{{sensor.sensor_n_serie}}" required>
                            <input type="number" name="sensor_voltagem" class="form-control"
                                value="{{sensor.sensor_voltagem}}" required>
                        </div>
                        <input type="text" name="sensor_modelo" class="form-control" value="{{sensor.sensor_modelo}}"
                            required>
                    </div>
                </div>

                <div class="d-flex gap-4 ">
                    <div class="w-100 d-flex">
                        <div class="col-12 col-md-3 w-50">
                            <input type="text" name="sensor_localizacao" class="form-control"
                                value="{{sensor.sensor_localizacao}}" required>
                        </div>
                        <div class="col-12 col-md-4 ms-3 w-50">
                            <button type="submit"
                                class="btn w-100 text-white background-verde-medio border-radius-menor">Salvar</button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
        {% endblock %}
